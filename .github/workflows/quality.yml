name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run audit
      - run: npm run test:plan
      - run: npm run test:backend-security
      - run: npm run preview -- --host 127.0.0.1 --background
      - run: npm run test:browser
      - run: npm run test:content-browser
      - run: npm run test:performance-browser
      - if: always()
        run: npx astro preview stop
