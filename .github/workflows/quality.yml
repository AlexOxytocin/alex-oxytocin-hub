name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: npm ci
      - run: python -m pip install --requirement backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          # Pixel baselines were captured with the legacy Windows Segoe UI stack.
          # The required Windows job below owns the non-portable screenshot gate.
          HOME_VISUAL_SKIP: "1"
      - run: npm run audit
      - run: npm run test:http:nginx

  home-visual:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: node scripts/run-preview-tests.mjs
        env:
          HOME_VISUAL_ONLY: "1"
