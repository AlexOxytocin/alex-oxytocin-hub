<svg xmlns="http://www.w3.org/2000/svg" width="216" height="30" viewBox="0 0 216 30" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Alex Oxytocin</title>
  <desc id="logo-description">Фирменный геометрический логотип с разомкнутой буквой A</desc>
  <defs>
    <linearGradient id="wordmark-colour" x1="2.5" y1="0" x2="213.5" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25e3d3" />
      <stop offset="0.34" stop-color="#25e3d3" />
      <stop offset="0.42" stop-color="#8668ff" />
      <stop offset="1" stop-color="#9f78ff" />
    </linearGradient>
    <mask id="custom-letterforms" x="2.5" y="8.5" width="211" height="13" maskUnits="userSpaceOnUse" style="mask-type:luminance">
      <image x="2.5" y="8.5" width="211" height="13" preserveAspectRatio="none" href="data:image/png;base64," />
    </mask>
  </defs>
  <rect x="2.5" y="8.5" width="211" height="13" fill="url(#wordmark-colour)" mask="url(#custom-letterforms)" />
</svg>
