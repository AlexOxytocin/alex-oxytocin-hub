intro: >
  Client systems, original products, and engineering tools. Completed cases are
  separated from work in progress, and metrics appear only where they can be substantiated.

groups:
  - { id: client-systems, title: Enterprise AI systems, description: "Solutions built around real processes, data, and business constraints. Selected details are protected by NDA.", project_slugs: [construction-budget, media-buyer, rag-platform] }
  - { id: products, title: Original products, description: "Tools that grew out of specific everyday and professional problems.", project_slugs: [flatscanner, community-platform] }
  - { id: engineering-platforms, title: Engineering platforms & process, description: "Durable agent execution, architecture decisions, and controlled AI-assisted delivery.", project_slugs: [symbioflow-engine, architectura, development-automation] }
  - { id: personal-operations, title: Personal operations automation, description: "Reproducible workflows for finance, reporting, and recurring obligations with human approval for critical actions.", project_slugs: [georgia-ip-automation, binance-warehouse] }
  - { id: community-learning, title: Community & learning, description: "An environment where tools become practice, projects, and transferable skills.", project_slugs: [allo-community, ai-training] }

approaches:
  - { title: Process before model, description: "Identify manual work, data sources, the decision owner, and the cost of error before choosing an agent, RAG, or conventional automation." }
  - { title: Reliability is product work, description: "Idempotency, retries, audit, observability, and recovery are designed with the happy path, not after the first incident." }
  - { title: Keep people in the loop, description: "Payments, publication, external mutations, and ambiguous decisions require explicit approval wherever an error costs more than an extra click." }
  - { title: Measure quality, description: "LLM workflows get testable contracts, evals, and acceptance criteria; impact is tied to time, cost, or output quality." }
  - { title: Knowledge lives in the repository, description: "Specs, ADRs, decisions, and validation results are versioned so work can continue without hidden session context." }

