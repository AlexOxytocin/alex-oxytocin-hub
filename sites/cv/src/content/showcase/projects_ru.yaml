intro: >
  Здесь собраны клиентские системы, собственные продукты и инженерные инструменты.
  Завершённые кейсы отделены от проектов в разработке, а цифры приведены только там,
  где их можно подтвердить.

groups:
  - id: client-systems
    title: Корпоративные AI-системы
    description: Решения для реальных процессов, данных и ограничений бизнеса. Часть деталей закрыта NDA.
    project_slugs: [construction-budget, media-buyer, rag-platform]
  - id: products
    title: Собственные продукты
    description: Инструменты, которые выросли из конкретных бытовых и профессиональных задач.
    project_slugs: [flatscanner, community-platform]
  - id: engineering-platforms
    title: Инженерные платформы и процесс
    description: Надёжное исполнение агентов, архитектурные решения и управляемая AI-assisted разработка.
    project_slugs: [symbioflow-engine, architectura, development-automation]
  - id: personal-operations
    title: Автоматизация личных операций
    description: Воспроизводимые контуры для финансов, отчётности и регулярных обязательств с ручным подтверждением критичных действий.
    project_slugs: [georgia-ip-automation, binance-warehouse]
  - id: community-learning
    title: Сообщество и обучение
    description: Среда, где инструменты превращаются в практику, проекты и передаваемые навыки.
    project_slugs: [allo-community, ai-training]

approaches:
  - title: Сначала процесс, потом модель
    description: Нахожу ручную работу, источник данных, владельца решения и цену ошибки; только после этого выбираю агент, RAG или обычную автоматизацию.
  - title: Надёжность — часть продукта
    description: Идемпотентность, retries, аудит, наблюдаемость и управляемое восстановление проектируются вместе с happy path, а не после первой аварии.
  - title: Человек остаётся в контуре
    description: Платёж, публикация, изменение внешней системы и неоднозначное решение требуют явного подтверждения там, где ошибка дороже лишнего клика.
  - title: Качество измеряется
    description: Для LLM-процессов задаю проверяемые контракты, evals и критерии приёмки; эффект связываю со временем, стоимостью или качеством результата.
  - title: Знание живёт в репозитории и трекерах
    description: Спецификации, ADR и архитектурные решения хранятся в репозитории; задачи, статусы и результаты приёмки — в рабочих трекерах. Поэтому работу можно продолжить без скрытого контекста сессии.

