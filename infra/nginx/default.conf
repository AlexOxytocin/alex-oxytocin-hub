# Target configuration for the staged Astro cutover. This file is checked and
# tested in GOD-7, but must not be installed on production before GOD-9
# acceptance and the documented rollback checkpoint.

include /etc/nginx/includes/compression.conf;

server_tokens off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

include /etc/nginx/includes/security-headers.conf;

# Plain HTTP apex requests go directly to their final HTTPS contract. Service
# paths keep their complete request URI; the retired voice path never redirects.
server {
    listen 80;
    server_name godmodetools.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ^~ /openclaw-voice/ {
        return 410;
    }

    location ^~ /api/ {
        return 301 https://godmodetools.com$request_uri;
    }

    location ^~ /voidplayer/ {
        return 301 https://godmodetools.com$request_uri;
    }

    location = / {
        return 301 https://godmodetools.com/ru/$is_args$args;
    }

    # Inventory representative for the no-redirect not-found contract.
    location = /__god2_unknown__/ {
        return 404;
    }

    location / {
        return 301 https://godmodetools.com$request_uri;
    }
}

# Canonical production site. `/api/` and `/voidplayer/` remain independent
# service prefixes, while every frontend miss ends as a real 404.
server {
    listen 443 ssl;
    http2 on;
    server_name godmodetools.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /usr/share/nginx/html/sites/current/site;
    index index.html;
    error_page 404 /404.html;

    location = / {
        return 301 https://godmodetools.com/ru/$is_args$args;
    }

    location ^~ /openclaw-voice/ {
        return 410;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location = /voidplayer/void.webmanifest {
        default_type application/manifest+json;
        alias /usr/share/nginx/html/voidplayer/void.webmanifest;
    }

    location ^~ /voidplayer/ {
        alias /usr/share/nginx/html/voidplayer/;
        index index.html;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    include /etc/nginx/includes/site-cache.conf;
}

# www is an alias only. Root skips the otherwise unavoidable apex-root hop;
# every other request keeps its path and query while moving to the apex host.
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.godmodetools.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = / {
        return 301 https://godmodetools.com/ru/$is_args$args;
    }

    location = /en/ {
        return 301 https://godmodetools.com/en/$is_args$args;
    }

    location / {
        return 301 https://godmodetools.com$request_uri;
    }
}

# Legacy CV host: only inventory-backed, one-step migrations are accepted.
# Download locations are intentionally exact so unknown files cannot be
# mistaken for migrated resumes.
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name cv.godmodetools.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = / {
        return 301 https://godmodetools.com/ru/experience/$is_args$args;
    }

    location = /en/ {
        return 301 https://godmodetools.com/en/experience/$is_args$args;
    }

    location = /java/ {
        return 301 https://godmodetools.com/ru/experience/java/$is_args$args;
    }

    location = /java/en/ {
        return 301 https://godmodetools.com/en/experience/java/$is_args$args;
    }

    location = /showcase/ {
        return 301 https://godmodetools.com/ru/projects/$is_args$args;
    }

    location = /showcase/en/ {
        return 301 https://godmodetools.com/en/projects/$is_args$args;
    }

    location = /changelog/ {
        return 301 https://godmodetools.com/ru/experience/changelog/$is_args$args;
    }

    location = /downloads/resume_ru.pdf {
        return 301 https://godmodetools.com/ru/experience/downloads/resume_ru.pdf$is_args$args;
    }

    location = /downloads/resume_ru.docx {
        return 301 https://godmodetools.com/ru/experience/downloads/resume_ru.docx$is_args$args;
    }

    location = /downloads/resume_ru.txt {
        return 301 https://godmodetools.com/ru/experience/downloads/resume_ru.txt$is_args$args;
    }

    location = /downloads/resume_en.pdf {
        return 301 https://godmodetools.com/en/experience/downloads/resume_en.pdf$is_args$args;
    }

    location = /downloads/resume_en.docx {
        return 301 https://godmodetools.com/en/experience/downloads/resume_en.docx$is_args$args;
    }

    location = /downloads/resume_en.txt {
        return 301 https://godmodetools.com/en/experience/downloads/resume_en.txt$is_args$args;
    }

    location = /downloads/resume_ru_java.pdf {
        return 301 https://godmodetools.com/ru/experience/java/downloads/resume_ru_java.pdf$is_args$args;
    }

    location = /downloads/resume_ru_java.docx {
        return 301 https://godmodetools.com/ru/experience/java/downloads/resume_ru_java.docx$is_args$args;
    }

    location = /downloads/resume_ru_java.txt {
        return 301 https://godmodetools.com/ru/experience/java/downloads/resume_ru_java.txt$is_args$args;
    }

    location = /downloads/resume_en_java.pdf {
        return 301 https://godmodetools.com/en/experience/java/downloads/resume_en_java.pdf$is_args$args;
    }

    location = /downloads/resume_en_java.docx {
        return 301 https://godmodetools.com/en/experience/java/downloads/resume_en_java.docx$is_args$args;
    }

    location = /downloads/resume_en_java.txt {
        return 301 https://godmodetools.com/en/experience/java/downloads/resume_en_java.txt$is_args$args;
    }

    location = /robots.txt {
        return 301 https://godmodetools.com/robots.txt$is_args$args;
    }

    location = /sitemap-index.xml {
        return 301 https://godmodetools.com/sitemap.xml$is_args$args;
    }

    location / {
        return 404;
    }
}

