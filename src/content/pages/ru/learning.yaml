locale: ru
route: learning
status: published
title: Индивидуальное обучение работе с ИИ
description: Соберите личного ИИ-помощника под реальную задачу и научитесь управлять процессом самостоятельно.
eyebrow: Индивидуальные занятия по ИИ · онлайн
heading: ИИ умеет больше, чем отвечать в чате. Научитесь поручать ему реальные дела.
intro: Соберите личного ИИ-помощника для почты, документов, финансов, поездок и повседневных дел. На занятиях вы настроите его под свою реальную задачу — и научитесь управлять им сами.
heroPoints: [30 минут бесплатно, Программирование не требуется, Всё собираем на вашей задаче]
primaryCta: Записаться на бесплатный чек-ап
examplesCta: Посмотреть примеры
comparisonLabel: Следующий шаг после чата
comparisonHeading: Ответ — это ещё не выполненная задача
comparison:
  - label: Обычный сценарий
    title: Спросить чат-бота
    steps: [Скопировать информацию в чат, Получить текст или совет, Вручную перенести всё в файлы, В следующий раз повторить заново]
  - label: Рабочий процесс
    title: Собрать ИИ-помощника
    steps: [Дать доступ только к нужным материалам, Описать последовательность и правила, Получить результат с источниками и проверками, Подтвердить важное действие и повторять процесс]
examplesLabel: Конкретные примеры
examplesHeading: Что вы сможете собрать для себя
examplesIntro: Это примеры, а не закрытое меню. Вы не ограничены кнопками готового приложения — мы описываем нужный результат обычными словами и собираем процесс под вас.
scenarioGroups:
  - label: Почта и соцсети
    title: Общаться быстрее — и оставаться собой
    items:
      - { title: "Письмо голосом с телефона", description: "Вы говорите: «Отправь Андрею последний инвойс и напиши, что оплата до пятницы». Помощник находит адресата и файл, готовит письмо и показывает его перед отправкой.", benefit: "От идеи до готового письма — одна голосовая команда" }
      - { title: "Цифровой двойник из переписок", description: "На основе выбранных диалогов собирает словарь, интонации, структуру мысли и примеры — чтобы черновики звучали похоже на вас.", benefit: "Быстрее писать сообщения, посты и ответы своим голосом" }
      - { title: "Циклы и паттерны в Telegram", description: "Сопоставляет темы, ритм общения и изменения активности во времени. Это материал для рефлексии, а не психологический диагноз.", benefit: "Замечать закономерности, которые трудно увидеть внутри дня" }
  - label: Финансы и документы
    title: Убрать ручную рутину, не отдавая ИИ ответственность
    items:
      - { title: "Учёт, инвойсы и декларации", description: "Собирает движения по счетам и инвойсы, ведёт простой учёт, формирует документы и заполняет черновик декларации по вашим правилам.", benefit: "Подготовить всё к проверке и подаче без ежемесячной сборки вручную" }
      - { title: "Статусы и сроки документов", description: "По расписанию проверяет официальный источник, сравнивает статус с прошлым и предупреждает об изменениях.", benefit: "Не пропустить изменение, срок или появление нового документа" }
      - { title: "Личный архив документов", description: "Раскладывает файлы по понятной структуре, распознаёт содержимое и ищет по смыслу.", benefit: "Получать нужный экземпляр за минуту, а не исследовать папку Downloads" }
  - label: Повседневная жизнь
    title: Собрать личные инструменты под себя
    items:
      - { title: "Тренер и трекер привычек", description: "Ведёт план тренировок и привычек, собирает прогресс, напоминает о следующем шаге и приблизительно оценивает калорийность еды по фото.", benefit: "Один персональный помощник вместо десятка негибких приложений" }
      - { title: "Сложный поиск поездок и жилья", description: "Ищет билеты, маршруты и квартиры по критериям, которых нет в фильтрах; изучает фото и отзывы и показывает риски и компромиссы.", benefit: "Получить короткий список с доказательствами, рисками и компромиссами" }
      - { title: "Личный ассистент с памятью", description: "Собирает разрешённый долговременный контекст из почты, документов, календаря, трекеров и прошлых диалогов.", benefit: "Не объяснять заново собственную жизнь в каждом новом чате" }
processLabel: Как проходит обучение
processHeading: Сначала ваша задача. Потом инструменты.
processIntro: Вы не покупаете закрытую коробку. На занятиях вы сами собираете процесс, понимаете его правила и можете менять его без меня.
process:
  - { title: "Бесплатный чек-ап", description: "За 30 минут разбираем, как вы уже используете ИИ и какая повторяющаяся задача отнимает у вас время." }
  - { title: "Выбираем один процесс", description: "Берём повторяющуюся задачу с проверяемым результатом, которую можно исправить без больших потерь." }
  - { title: "Собираем вместе", description: "Подбираем инструменты, подключаем нужные материалы и определяем ограничения и точки ручного подтверждения." }
  - { title: "Вы управляете сами", description: "Вы учитесь менять инструкции и источники, проверять результат и понимать, где ИИ должен остановиться и спросить вас." }
contactLabel: Бесплатная ознакомительная встреча
contactHeading: Какую задачу вы до сих пор делаете вручную?
contactIntro: Напишите мне слово «задача» и в двух-трёх предложениях расскажите, что приходится регулярно искать, переносить, сверять или оформлять. На 30-минутной встрече определим, что можно поручить ИИ и с чего начать.
contactPoints: [Без обязательства покупать занятия, С понятным следующим шагом, Онлайн один на один]
safetyNote: Не присылайте конфиденциальные файлы до того, как мы отдельно обсудим безопасный способ работы с ними.
